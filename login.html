<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Trisenpai Bootcamp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white">
  <div class="flex items-center justify-center min-h-screen px-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-lg shadow-cyan-500/10">
        <div class="text-center mb-8">
          <a href="isi.html" class="flex items-center justify-center space-x-2 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-cyan-400">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span class="text-2xl font-bold text-white">Trisenpai</span>
          </a>
          <h1 class="text-2xl font-bold text-white">Login ke Akun Anda</h1>
          <p class="text-slate-400 mt-1">Masukkan kredensial yang telah diberikan.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="space-y-4">
            <div>
              <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
              <input type="text" id="username" name="username" placeholder="contoh: mahasiswa" required class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-colors">
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
              <div class="relative">
                <input type="password" id="password" name="password" placeholder="••••••••" required class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-colors pr-10">
                <button type="button" id="toggle-password-btn" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-500 hover:text-slate-300">
                  <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.022 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                  </svg>
                  <svg id="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zM9 4.804A7.968 7.968 0 0110 5c3.976 0 7.23 2.548 8.499 6.087a1 1 0 01-1.414 1.414l-1.721-1.721A4 4 0 0010 8c-1.033 0-1.95.402-2.647 1.055l-1.313-1.313A7.968 7.968 0 019 4.804zM4.091 15.091A9.941 9.941 0 01.458 10c1.274-4.057 5.022-7 9.542-7 .847 0 1.67.111 2.457.314l-1.48 1.48A4.002 4.002 0 0010 12a4.002 4.002 0 004.49 3.512l1.22 1.22A9.941 9.941 0 014.09 15.09z" clip-rule="evenodd"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <p id="error-message" class="text-red-400 text-sm text-center mt-4 h-5"></p>

          <button type="submit" class="w-full mt-6 bg-cyan-400 text-slate-900 font-bold px-5 py-3 rounded-lg hover:bg-cyan-500 transition-all transform hover:scale-105">
            Login
          </button>
        </form>

        <div class="text-center mt-6">
          <a href="isi.html" class="text-sm text-slate-400 hover:text-cyan-400 transition-colors">Kembali ke Halaman Utama</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/login.js"></script>
</body>
</html>
