<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi Pelajaran - C</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/materi.css">
</head>
<body class="bg-slate-950 text-slate-200">
  <main class="container mx-auto p-4 md:p-8 max-w-4xl">

    <button id="back-to-modules-btn" class="mb-6 flex items-center gap-2 text-slate-300 hover:text-cyan-400 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
      </svg>
      <span>Kembali ke Modul</span>
    </button>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 md:p-8">
      <h1 id="lesson-title" class="text-4xl font-extrabold text-white mb-6">Memuat...</h1>

      <div id="lesson-content" class="prose prose-invert prose-lg max-w-none text-slate-300 space-y-4"></div>

      <div id="lesson-gif-container" class="my-8 hidden">
        <img id="lesson-gif" src="" alt="Lesson GIF" class="mx-auto rounded-lg border border-slate-700">
      </div>

      <div class="my-8">
        <h2 class="text-xl font-semibold text-white mb-3">Instruksi</h2>
        <p class="text-slate-400 mb-4">Salin dan tempel baris kode di bawah ini.</p>
        <div class="bg-slate-950 rounded-lg overflow-hidden">
          <div class="flex justify-between items-center px-4 py-2 bg-slate-800">
            <span class="text-xs text-slate-400">main.cpp</span>
            <button id="copy-code-btn" class="text-xs text-slate-400 hover:text-white transition-colors">
              <span id="copy-code-text">Salin</span>
            </button>
          </div>
          <pre class="p-4 text-sm"><code id="code-block" class="language-cpp"></code></pre>
        </div>
      </div>

      <div id="output-section" class="my-8">
        <p class="text-slate-400 mb-4">Ini akan muncul di Terminal kalau udah bener:</p>
        <div class="bg-slate-950 rounded-lg overflow-hidden">
          <div class="flex justify-between items-center px-4 py-2 bg-slate-800">
            <span class="text-xs text-slate-400">Terminal</span>
            <button id="copy-output-btn" class="text-xs text-slate-400 hover:text-white transition-colors">
              <span id="copy-output-text">Salin</span>
            </button>
          </div>
          <pre class="p-4 text-sm text-slate-300"><code id="output-block"></code></pre>
        </div>
      </div>

      <div id="second-example-section" class="hidden">
        <div class="my-8">
          <h2 id="second-example-title" class="text-xl font-semibold text-white mb-3"></h2>
          <div class="bg-slate-950 rounded-lg overflow-hidden">
            <div class="flex justify-between items-center px-4 py-2 bg-slate-800">
              <span class="text-xs text-slate-400">main.cpp</span>
              <button id="copy-code-btn-2" class="text-xs text-slate-400 hover:text-white">
                <span id="copy-code-text-2">Salin</span>
              </button>
            </div>
            <pre class="p-4 text-sm"><code id="code-block-2" class="language-cpp"></code></pre>
          </div>
        </div>
        <div id="output-section-2" class="my-8">
          <p class="text-slate-400 mb-4">Output:</p>
          <div class="bg-slate-950 rounded-lg overflow-hidden">
            <div class="flex justify-between items-center px-4 py-2 bg-slate-800">
              <span class="text-xs text-slate-400">Terminal</span>
              <button id="copy-output-btn-2" class="text-xs text-slate-400 hover:text-white">
                <span id="copy-output-text-2">Salin</span>
              </button>
            </div>
            <pre class="p-4 text-sm text-slate-300"><code id="output-block-2"></code></pre>
          </div>
        </div>
      </div>

      <div class="mt-10 pt-6 border-t border-slate-800">
        <h2 class="text-xl font-semibold text-white mb-4">Materi Tambahan</h2>
        <div class="space-y-4">

          <div class="bg-slate-800/50 p-4 rounded-lg">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-300">Walkthrough Video</span>
              <button id="watch-video-btn" class="btn-3d flex items-center gap-2 px-4 py-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Tonton
              </button>
            </div>
            <div id="video-player-container" class="mt-4 hidden">
              <div class="relative group bg-black rounded-lg">
                <video id="lesson-video-player" class="w-full h-auto rounded-lg"></video>
                <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                  <div class="flex items-center gap-3 text-white">
                    <span id="current-time" class="text-sm font-mono">00:00</span>
                    <input id="progress-bar" type="range" value="0" step="0.1" class="w-full h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer">
                    <span id="duration" class="text-sm font-mono">00:00</span>
                  </div>
                  <div class="flex items-center justify-center gap-6 text-white mt-2">
                    <button id="rewind-btn" title="Mundur 10 detik">
                      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/>
                      </svg>
                    </button>
                    <button id="play-pause-btn">
                      <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path>
                      </svg>
                    </button>
                    <button id="forward-btn" title="Maju 10 detik">
                      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 9l6 6m0 0-6 6m6-6H9a6 6 0 0 1 0-12h3"/>
                      </svg>
                    </button>
                    <div class="flex-grow"></div>
                    <button id="fullscreen-btn" title="Fullscreen">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m12 0l-5-5m5 5v4m0 0h-4m-4 8h4m0 0v-4m0 4l-5-5m-5 5l5-5"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-slate-800/50 flex justify-between items-center p-4 rounded-lg">
            <span class="font-semibold text-slate-300">Latihan Kode (vjudge)</span>
            <a href="#" target="_blank" class="btn-3d flex items-center gap-2 px-4 py-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              Akses
            </a>
          </div>

          <div class="bg-slate-800/50 flex justify-between items-center p-4 rounded-lg">
            <span class="font-semibold text-slate-300">Presentasi (Canva)</span>
            <a href="#" target="_blank" rel="noopener" class="btn-3d flex items-center gap-2 px-4 py-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <line x1="10" y1="9" x2="8" y2="9"></line>
              </svg>
              Lihat
            </a>
          </div>

        </div>
      </div>

      <div id="completion-section" class="mt-10 border-t border-slate-800 pt-6">
        <button id="mark-as-complete-btn" class="w-full bg-cyan-500 text-slate-900 font-bold px-5 py-3 rounded-lg hover:bg-cyan-600 transition-all text-lg">
          Tandai Selesai & Kembali
        </button>
      </div>
    </div>

  </main>
  <script src="assets/materi.js"></script>
</body>
</html>
